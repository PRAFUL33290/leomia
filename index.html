// ============ LEVEL PARSING ============
let level = null;

function loadLevel(idx) {
  const data = LEVELS[idx];
  const map = [];
  const entities = { keys: [], crystals: [], switches: [], gates: [], spikes: [],
    blocks: [], hidden: [], dualPlates: [], symbolPlates: [], torches: [], orbs: [],
    weakWalls: [], doors: [], exit: null, enemies: [], boss: null };
  let leoStart = {x:1,y:1}, miaStart = {x:1,y:2};

  for (let y = 0; y < data.map.length; y++) {
    const row = [];
    for (let x = 0; x < data.map[y].length; x++) {
      const c = data.map[y][x];
      let tile = T.FLOOR;
      switch(c) {
        case '#': tile = T.WALL; break;
        case '.': tile = T.FLOOR; break;
        case 'L': leoStart = {x, y}; tile = T.FLOOR; break;
        case 'M': miaStart = {x, y}; tile = T.FLOOR; break;
        case 'K': entities.keys.push({x, y, taken: false}); tile = T.FLOOR; break;
        case 'D': entities.doors.push({x, y, open: false}); tile = T.DOOR; break;
        case 'E': entities.exit = {x, y}; tile = T.EXIT; break;
        case 'C': entities.crystals.push({x, y, taken: false}); tile = T.FLOOR; break;
        case 'S': entities.switches.push({x, y, active: false}); tile = T.SWITCH; break;
        case 'G': entities.gates.push({x, y, open: false}); tile = T.GATE; break;
        case 'X': entities.spikes.push({x, y}); tile = T.SPIKE; break;
        case 'B': entities.blocks.push({x, y}); tile = T.FLOOR; break;
        case 'H': entities.hidden.push({x, y, revealed: false}); tile = T.HIDDEN; break;
        case '1': entities.dualPlates.push({x, y, id: 'A', active: false}); tile = T.FLOOR; break;
        case '2': entities.dualPlates.push({x, y, id: 'B', active: false}); tile = T.FLOOR; break;
        case 't': entities.torches.push({x, y, taken: false}); tile = T.FLOOR; break;
        case 'd': tile = T.DARK_FLOOR; break;
        case 'o': entities.orbs.push({x, y, taken: false}); tile = T.FLOOR; break;
        case '*': entities.weakWalls.push({x, y, broken: false}); tile = T.WEAK_WALL; break;
        case 'a': entities.symbolPlates.push({x, y, id: 'A', active: false}); tile = T.FLOOR; break;
        case 'b': entities.symbolPlates.push({x, y, id: 'B', active: false}); tile = T.FLOOR; break;
        case 'c': entities.symbolPlates.push({x, y, id: 'C', active: false}); tile = T.FLOOR; break;
        case '@': entities.boss = {x: x*TILE+20, y: y*TILE+20, hp: 5, dir: 0, cool: 0}; tile = T.FLOOR; break;
      }
      row.push(tile);
    }
    map.push(row);
  }

  // Enemies for level 7
  if (idx === 6) {
    entities.enemies.push({x: 5*TILE, y: 6*TILE, dx: 1, dy: 0, type: 'slime', alive: true});
    entities.enemies.push({x: 12*TILE, y: 6*TILE, dx: -1, dy: 0, type: 'slime', alive: true});
    entities.enemies.push({x: 9*TILE, y: 8*TILE, dx: 0, dy: 1, type: 'bat', alive: true});
  }

  const decorations = generateDecorations(map, entities, leoStart, miaStart, data.biome, idx);

  level = {
    data, map, entities, decorations,
    leo: { x: leoStart.x * TILE + 4, y: leoStart.y * TILE + 4, dir: 'down', moving: false, attackTimer: 0, hasKey: 0 },
    mia: { x: miaStart.x * TILE + 4, y: miaStart.y * TILE + 4, dir: 'down', moving: false, magicTimer: 0 },
    symbolOrder: [],
    timer: data.timer || null,
    timeLeft: data.timer || null,
    won: false,
    hits: 0,
  };
}

function generateDecorations(map, entities, leoStart, miaStart, biome, idx) {
  const occ = new Set();
  const mark = (x,y) => occ.add(x+','+y);
  mark(leoStart.x, leoStart.y); mark(miaStart.x, miaStart.y);
  ['keys','crystals','switches','gates','spikes','blocks','hidden','dualPlates','symbolPlates','torches','orbs','weakWalls','doors'].forEach(k =>
    entities[k].forEach(e => mark(e.x, e.y))
  );
  if (entities.exit) mark(entities.exit.x, entities.exit.y);

  let seed = idx * 1731 + 9277;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed/233280; };

  const decos = [];
  for (let y = 0; y < map.length; y++) {
    for (let x = 0; x < map[y].length; x++) {
      if (map[y][x] !== T.FLOOR && map[y][x] !== T.DARK_FLOOR) continue;
      if (occ.has(x+','+y)) continue;
      // Only near walls to avoid blocking path visually
      const nearWall = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) =>
        map[y+dy] && (map[y+dy][x+dx] === T.WALL || map[y+dy][x+dx] === T.WEAK_WALL)
      );
      if (!nearWall) continue;
      if (rnd() > 0.55) continue;
      decos.push({ x, y, variant: Math.floor(rnd()*4), t: rnd() });
    }
  }
  return decos;
}

// ============ COLLISIONS ============
function tileAt(px, py) {
  const tx = Math.floor(px / TILE);
  const ty = Math.floor(py / TILE);
  if (ty < 0 || ty >= level.map.length || tx < 0 || tx >= level.map[0].length) return T.WALL;
  return level.map[ty][tx];
}

function isSolid(tx, ty, who) {
  if (ty < 0 || ty >= level.map.length || tx < 0 || tx >= level.map[0].length) return true;
  const t = level.map[ty][tx];
  if (t === T.WALL) return true;
  if (t === T.HIDDEN) {
    const h = level.entities.hidden.find(h => h.x === tx && h.y === ty);
    // Mia can see/pass when she's the active char (reveals path)
    if (h && !h.revealed) return who !== 'mia';
    return false;
  }
  if (t === T.GATE) {
    const g = level.entities.gates.find(g => g.x === tx && g.y === ty);
    if (g && !g.open) return true;
    return false;
  }
  if (t === T.DOOR) {
    const d = level.entities.doors.find(d => d.x === tx && d.y === ty);
    if (d && !d.open) return true;
    return false;
  }
  if (t === T.WEAK_WALL) {
    const w = level.entities.weakWalls.find(w => w.x === tx && w.y === ty);
    if (w && !w.broken) return true;
    return false;
  }
  // blocks
  const block = level.entities.blocks.find(b => b.x === tx && b.y === ty);
  if (block) return true;
  return false;
}

function rectVsSolid(px, py, who) {
  const corners = [
    [px+2, py+2],
    [px+TILE-6, py+2],
    [px+2, py+TILE-6],
    [px+TILE-6, py+TILE-6],
  ];
  for (const [cx, cy] of corners) {
    const tx = Math.floor(cx / TILE);
    const ty = Math.floor(cy / TILE);
    if (isSolid(tx, ty, who)) return true;
  }
  return false;
}

// ============ MOVEMENT ============
function tryMove(ent, dx, dy, who) {
  const speed = 2.5;
  let nx = ent.x + dx * speed;
  let ny = ent.y + dy * speed;
  if (dx !== 0) {
    if (!rectVsSolid(nx, ent.y, who)) ent.x = nx;
    else {
      // try push block
      tryPushBlock(ent, dx, 0, who);
    }
  }
  if (dy !== 0) {
    if (!rectVsSolid(ent.x, ny, who)) ent.y = ny;
    else {
      tryPushBlock(ent, 0, dy, who);
    }
  }
  if (dx > 0) ent.dir = 'right';
  else if (dx < 0) ent.dir = 'left';
  else if (dy > 0) ent.dir = 'down';
  else if (dy < 0) ent.dir = 'up';
  ent.moving = (dx !== 0 || dy !== 0);
}

function tryPushBlock(ent, dx, dy, who) {
  if (who !== 'leo') return;
  // Find block in direction
  const cx = ent.x + TILE/2 + dx*TILE;
  const cy = ent.y + TILE/2 + dy*TILE;
  const tx = Math.floor(cx / TILE);
  const ty = Math.floor(cy / TILE);
  const block = level.entities.blocks.find(b => b.x === tx && b.y === ty);
  if (!block) return;
  const nx = tx + dx, ny = ty + dy;
  if (isSolid(nx, ny, 'leo')) return;
  block.x = nx; block.y = ny;
}

// ============ INTERACT ============
function interactFor(who) {
  const ch = who === 'leo' ? level.leo : level.mia;
  // Check tile in front
  let fx = 0, fy = 0;
  if (ch.dir === 'up') fy = -1;
  else if (ch.dir === 'down') fy = 1;
  else if (ch.dir === 'left') fx = -1;
  else if (ch.dir === 'right') fx = 1;
  const tx = Math.floor((ch.x + TILE/2) / TILE) + fx;
  const ty = Math.floor((ch.y + TILE/2) / TILE) + fy;

  // Door
  const door = level.entities.doors.find(d => d.x === tx && d.y === ty);
  if (door && !door.open) {
    if (level.leo.hasKey > 0) {
      door.open = true;
      level.leo.hasKey--;
      showMsg("Porte ouverte !");
    } else {
      showMsg("Il faut une clé !");
    }
    return;
  }

  // Switch
  const sw = level.entities.switches.find(s => s.x === tx && s.y === ty);
  if (sw) {
    sw.active = !sw.active;
    // Open all gates
    level.entities.gates.forEach(g => g.open = level.entities.switches.some(s => s.active));
    showMsg(sw.active ? "Interrupteur activé !" : "Désactivé.");
    return;
  }

  // Weak wall (Léo only)
  if (who === 'leo') {
    const w = level.entities.weakWalls.find(w => w.x === tx && w.y === ty);
    if (w && !w.broken) {
      w.broken = true;
      showMsg("Mur brisé !");
      return;
    }
  }

  // Hidden (Mia reveals)
  if (who === 'mia') {
    const h = level.entities.hidden.find(h => h.x === tx && h.y === ty);
    if (h && !h.revealed) {
      h.revealed = true;
      showMsg("Passage révélé !");
      level.mia.magicTimer = 30;
      return;
    }
  }

  showMsg("...");
}

function attack() {
  level.leo.attackTimer = 15;
  // Hit enemies in front
  let fx = 0, fy = 0;
  if (level.leo.dir === 'up') fy = -1;
  else if (level.leo.dir === 'down') fy = 1;
  else if (level.leo.dir === 'left') fx = -1;
  else if (level.leo.dir === 'right') fx = 1;
  const ax = level.leo.x + TILE/2 + fx*TILE;
  const ay = level.leo.y + TILE/2 + fy*TILE;
  level.entities.enemies.forEach(e => {
    if (e.alive && Math.abs(e.x - ax) < TILE && Math.abs(e.y - ay) < TILE) {
      e.alive = false;
      showMsg("Ennemi vaincu !");
    }
  });
  // Boss
  if (level.entities.boss) {
    const b = level.entities.boss;
    if (Math.abs(b.x - ax) < TILE && Math.abs(b.y - ay) < TILE && b.cool <= 0) {
      b.hp--;
      b.cool = 30;
      showMsg(`Gardien: ${b.hp} PV restants !`);
      if (b.hp <= 0) {
        showMsg("Gardien vaincu ! Récupère le cristal !");
      }
    }
  }
}

// ============ UPDATE ============
function showMsg(m) { message = m; messageTimer = 120; }

function updateGame() {
  if (state !== STATE.PLAYING) return;

  // --- LÉO (P1) : Flèches + Entrée (interagir) + ShiftRight (attaquer) ---
  let dx1 = 0, dy1 = 0;
  if (keys['ArrowLeft']) dx1 = -1;
  else if (keys['ArrowRight']) dx1 = 1;
  if (keys['ArrowUp']) dy1 = -1;
  else if (keys['ArrowDown']) dy1 = 1;
  tryMove(level.leo, dx1, dy1, 'leo');
  if (consumePress('Enter')) interactFor('leo');
  if (consumePress('ShiftRight') || consumePress('Space')) attack();

  // --- MIA (P2) : ZQSD + F (magie / interagir) ---
  let dx2 = 0, dy2 = 0;
  if (keys['KeyQ'] || keys['KeyA']) dx2 = -1;
  else if (keys['KeyD']) dx2 = 1;
  if (keys['KeyZ'] || keys['KeyW']) dy2 = -1;
  else if (keys['KeyS']) dy2 = 1;
  tryMove(level.mia, dx2, dy2, 'mia');
  if (consumePress('KeyF') || consumePress('KeyE')) interactFor('mia');

  // Timer
  if (level.timeLeft !== null) {
    level.timeLeft -= 1/60;
    if (level.timeLeft <= 0) {
      state = STATE.GAMEOVER;
    }
  }

  // Pickups & hazards — applied for BOTH characters
  for (const who of ['leo', 'mia']) {
    const ch2 = who === 'leo' ? level.leo : level.mia;
    const cxt = Math.floor((ch2.x + TILE/2) / TILE);
    const cyt = Math.floor((ch2.y + TILE/2) / TILE);

    level.entities.keys.forEach(k => {
      if (!k.taken && k.x === cxt && k.y === cyt) {
        k.taken = true; level.leo.hasKey++;
        showMsg((who === 'leo' ? "Léo" : "Mia") + " a trouvé une clé !");
      }
    });
    level.entities.torches.forEach(t => {
      if (!t.taken && t.x === cxt && t.y === cyt) {
        t.taken = true; showMsg("Torche ! La lumière s'élargit.");
      }
    });
    level.entities.orbs.forEach(o => {
      if (!o.taken && o.x === cxt && o.y === cyt) {
        o.taken = true;
        level.entities.hidden.forEach(h => h.revealed = true);
        showMsg("Orbe magique ! Passages révélés !");
      }
    });
    level.entities.spikes.forEach(s => {
      if (s.x === cxt && s.y === cyt) {
        respawn();
        showMsg("Aïe ! Les pics !");
      }
    });
  }

  // Enemies
  level.entities.enemies.forEach(e => {
    if (!e.alive) return;
    e.x += e.dx;
    e.y += e.dy;
    const etx = Math.floor((e.x+TILE/2)/TILE);
    const ety = Math.floor((e.y+TILE/2)/TILE);
    if (isSolid(etx + Math.sign(e.dx), ety, 'enemy') || isSolid(etx, ety + Math.sign(e.dy), 'enemy')) {
      e.dx *= -1; e.dy *= -1;
    }
    // Touch either player
    for (const pch of [level.leo, level.mia]) {
      if (Math.abs(e.x - pch.x) < TILE-10 && Math.abs(e.y - pch.y) < TILE-10) {
        respawn();
        showMsg("Touché par un ennemi !");
        break;
      }
    }
  });

  // Boss
  if (level.entities.boss) {
    const b = level.entities.boss;
    if (b.cool > 0) b.cool--;
    if (b.hp > 0) {
      // Move toward closest player
      const dLeo = Math.hypot(level.leo.x - b.x, level.leo.y - b.y);
      const dMia = Math.hypot(level.mia.x - b.x, level.mia.y - b.y);
      const target = dLeo < dMia ? level.leo : level.mia;
      const ddx = target.x - b.x, ddy = target.y - b.y;
      const dist = Math.hypot(ddx, ddy);
      if (dist > 1) { b.x += ddx/dist * 1.2; b.y += ddy/dist * 1.2; }
      for (const pch of [level.leo, level.mia]) {
        if (Math.abs(b.x - pch.x) < TILE-8 && Math.abs(b.y - pch.y) < TILE-8) {
          respawn();
          b.x = 9*TILE+20; b.y = 6*TILE+20; b.hp = Math.min(5, b.hp+1);
          showMsg("Le Gardien vous a frappés !");
          break;
        }
      }
    }
  }

  // Crystals — either player can pick up
  level.entities.crystals.forEach(c => {
    if (c.taken) return;
    for (const pch of [level.leo, level.mia]) {
      const pxt = Math.floor((pch.x + TILE/2) / TILE);
      const pyt = Math.floor((pch.y + TILE/2) / TILE);
      if (c.x === pxt && c.y === pyt) {
        if (level.entities.boss && level.entities.boss.hp > 0) {
          showMsg("Bats d'abord le Gardien !");
          return;
        }
        c.taken = true;
        crystals++;
        state = STATE.LEVEL_COMPLETE;
        showMsg("Cristal récupéré !");
        break;
      }
    }
    if (c.taken) {
      if (currentLevel + 1 > maxUnlocked) maxUnlocked = currentLevel + 1;
    }
  });

  // Dual plates
  level.entities.dualPlates.forEach(p => {
    const onIt = (Math.floor((level.leo.x+TILE/2)/TILE) === p.x && Math.floor((level.leo.y+TILE/2)/TILE) === p.y) ||
                 (Math.floor((level.mia.x+TILE/2)/TILE) === p.x && Math.floor((level.mia.y+TILE/2)/TILE) === p.y);
    p.active = onIt;
  });
  if (level.entities.dualPlates.length >= 2) {
    const allActive = level.entities.dualPlates.every(p => p.active);
    level.entities.gates.forEach(g => g.open = allActive);
  }

  // Symbol plates (sequence A B C)
  level.entities.symbolPlates.forEach(p => {
    const onIt = (Math.floor((level.leo.x+TILE/2)/TILE) === p.x && Math.floor((level.leo.y+TILE/2)/TILE) === p.y) ||
                 (Math.floor((level.mia.x+TILE/2)/TILE) === p.x && Math.floor((level.mia.y+TILE/2)/TILE) === p.y);
    if (onIt && !p.active) {
      p.active = true;
      level.symbolOrder.push(p.id);
      const expected = ['A','B','C'];
      const wrong = level.symbolOrder.some((s,i) => s !== expected[i]);
      if (wrong) {
        showMsg("Mauvais ordre ! Recommence.");
        level.symbolOrder = [];
        level.entities.symbolPlates.forEach(pp => pp.active = false);
      } else {
        showMsg(`Symbole ${p.id} activé !`);
        if (level.symbolOrder.length === 3) {
          level.entities.gates.forEach(g => g.open = true);
          showMsg("Ordre correct ! Grille ouverte !");
        }
      }
    }
  });

  if (messageTimer > 0) messageTimer--;
}

function respawn() {
  const data = level.data;
  for (let y = 0; y < data.map.length; y++) {
    for (let x = 0; x < data.map[y].length; x++) {
      if (data.map[y][x] === 'L') { level.leo.x = x*TILE+4; level.leo.y = y*TILE+4; }
      if (data.map[y][x] === 'M') { level.mia.x = x*TILE+4; level.mia.y = y*TILE+4; }
    }
  }
}

// ============ RENDERING ============
function biomeColors(b) {
  switch(b) {
    case 'forest': return { floor: '#2d5a2d', floor2: '#3a6e3a', wall: '#5a3a1a', wallTop: '#7a5a2a' };
    case 'cave': return { floor: '#3a3a4a', floor2: '#4a4a5a', wall: '#222', wallTop: '#444' };
    case 'temple': return { floor: '#7a6a4a', floor2: '#8a7a5a', wall: '#3a2a1a', wallTop: '#5a4a2a' };
    case 'dark': return { floor: '#1a1a2a', floor2: '#22223a', wall: '#0a0a1a', wallTop: '#1a1a2a' };
    case 'castle': return { floor: '#4a3a5a', floor2: '#5a4a6a', wall: '#2a1a3a', wallTop: '#4a3a5a' };
    default: return { floor: '#444', floor2: '#555', wall: '#222', wallTop: '#444' };
  }
}

function drawTile(t, px, py, biome, x, y) {
  const c = biomeColors(biome);
  // floor base
  ctx.fillStyle = ((x+y) % 2 === 0) ? c.floor : c.floor2;
  ctx.fillRect(px, py, TILE, TILE);

  if (t === T.WALL) {
    ctx.fillStyle = c.wall;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = c.wallTop;
    ctx.fillRect(px, py, TILE, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(px, py+TILE-2, TILE, 2);
  } else if (t === T.SPIKE) {
    ctx.fillStyle = '#888';
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(px+i*10+2, py+TILE-4);
      ctx.lineTo(px+i*10+6, py+8);
      ctx.lineTo(px+i*10+10, py+TILE-4);
      ctx.fill();
    }
  } else if (t === T.SWITCH) {
    ctx.fillStyle = '#444';
    ctx.fillRect(px+10, py+10, 20, 20);
    const sw = level.entities.switches.find(s => s.x === x && s.y === y);
    ctx.fillStyle = sw && sw.active ? '#ffeb70' : '#aa3030';
    ctx.fillRect(px+14, py+14, 12, 12);
  } else if (t === T.GATE) {
    const g = level.entities.gates.find(g => g.x === x && g.y === y);
    if (!g || !g.open) {
      ctx.fillStyle = '#8a6a3a';
      for (let i = 0; i < 4; i++) {
        ctx.fillRect(px+4+i*9, py+2, 6, TILE-4);
      }
      ctx.fillStyle = '#aa8a4a';
      ctx.fillRect(px+2, py+TILE/2-2, TILE-4, 4);
    }
  } else if (t === T.DOOR) {
    const d = level.entities.doors.find(d => d.x === x && d.y === y);
    if (!d || !d.open) {
      ctx.fillStyle = '#6a3a1a';
      ctx.fillRect(px+4, py+2, TILE-8, TILE-4);
      ctx.fillStyle = '#ffeb70';
      ctx.fillRect(px+TILE-12, py+TILE/2-2, 4, 4);
    } else {
      ctx.fillStyle = '#1a0a05';
      ctx.fillRect(px+4, py+2, TILE-8, TILE-4);
    }
  } else if (t === T.HIDDEN) {
    const h = level.entities.hidden.find(h => h.x === x && h.y === y);
    if (h && !h.revealed) {
      // Looks like wall, but with subtle magical shimmer for Mia
      ctx.fillStyle = c.wall;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = c.wallTop;
      ctx.fillRect(px, py, TILE, 6);
      // Subtle purple shimmer to hint
      const tt = (Date.now()/400 + x*0.3 + y*0.5) % (Math.PI*2);
      ctx.fillStyle = `rgba(180,140,255,${0.05 + Math.abs(Math.sin(tt))*0.10})`;
      ctx.fillRect(px+4, py+4, TILE-8, TILE-8);
    }
  } else if (t === T.WEAK_WALL) {
    const w = level.entities.weakWalls.find(w => w.x === x && w.y === y);
    if (w && !w.broken) {
      ctx.fillStyle = c.wall;
      ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#aa3030';
      ctx.fillRect(px+5, py+5, 4, 4);
      ctx.fillRect(px+15, py+20, 4, 4);
      ctx.fillRect(px+25, py+10, 4, 4);
    }
  } else if (t === T.DARK_FLOOR) {
    ctx.fillStyle = '#15152a';
    ctx.fillRect(px, py, TILE, TILE);
  }
}

function drawDecorations(biome) {
  if (!level.decorations) return;
  level.decorations.forEach(d => drawDeco(d, biome));
}

function drawDeco(d, biome) {
  const px = d.x * TILE, py = d.y * TILE;
  const v = d.variant;
  if (biome === 'forest') {
    if (v === 0) drawTree(px, py);
    else if (v === 1) drawBush(px, py);
    else if (v === 2) drawMushroom(px, py, '#cc3333', '#ffeecc');
    else drawFlowers(px, py, d.t);
  } else if (biome === 'cave') {
    if (v === 0) drawStalagmite(px, py, false);
    else if (v === 1) drawStalagmite(px, py, true);
    else if (v === 2) drawRock(px, py);
    else drawMushroom(px, py, '#8866cc', '#ddccff');
  } else if (biome === 'temple') {
    if (v === 0) drawColumn(px, py);
    else if (v === 1) drawUrn(px, py);
    else if (v === 2) drawVine(px, py);
    else drawFlowers(px, py, d.t);
  } else if (biome === 'dark') {
    if (v === 0) drawGlowMushroom(px, py);
    else if (v === 1) drawBones(px, py);
    else if (v === 2) drawCobweb(px, py);
    else drawGlowMushroom(px, py);
  } else if (biome === 'castle') {
    if (v === 0) drawBanner(px, py, '#882244');
    else if (v === 1) drawBanner(px, py, '#225588');
    else if (v === 2) drawUrn(px, py);
    else drawColumn(px, py);
  }
}

function drawTree(px, py) {
  // trunk
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(px+TILE/2-3, py+TILE-14, 6, 12);
  // foliage
  ctx.fillStyle = '#1f4a1f';
  ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE/2-2, 11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2d6a2d';
  ctx.beginPath(); ctx.arc(px+TILE/2-3, py+TILE/2-4, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a8a3a';
  ctx.beginPath(); ctx.arc(px+TILE/2-4, py+TILE/2-6, 3, 0, Math.PI*2); ctx.fill();
}

function drawBush(px, py) {
  ctx.fillStyle = '#2d5a2d';
  ctx.beginPath(); ctx.arc(px+TILE/2-5, py+TILE-10, 7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+TILE/2+4, py+TILE-9, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a7a3a';
  ctx.beginPath(); ctx.arc(px+TILE/2-3, py+TILE-13, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+TILE/2+5, py+TILE-12, 4, 0, Math.PI*2); ctx.fill();
}

function drawMushroom(px, py, capColor, dotColor) {
  ctx.fillStyle = '#eedfbb';
  ctx.fillRect(px+TILE/2-2, py+TILE-10, 4, 8);
  ctx.fillStyle = capColor;
  ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE-10, 6, Math.PI, 0); ctx.fill();
  ctx.fillStyle = dotColor;
  ctx.beginPath(); ctx.arc(px+TILE/2-2, py+TILE-12, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+TILE/2+2, py+TILE-11, 1.2, 0, Math.PI*2); ctx.fill();
}

function drawFlowers(px, py, t) {
  const colors = ['#ff66aa','#ffee44','#aa88ff','#ff8844'];
  for (let i = 0; i < 3; i++) {
    const fx = px+8 + i*9 + (t*4|0);
    const fy = py+TILE-6 - ((i*7+t*9|0)%4);
    ctx.fillStyle = colors[(i+(t*4|0))%colors.length];
    ctx.beginPath(); ctx.arc(fx, fy, 2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a7a3a';
    ctx.fillRect(fx, fy, 1, 3);
  }
}

function drawStalagmite(px, py, fromCeiling) {
  ctx.fillStyle = '#666677';
  if (fromCeiling) {
    ctx.beginPath();
    ctx.moveTo(px+TILE/2-5, py);
    ctx.lineTo(px+TILE/2+5, py);
    ctx.lineTo(px+TILE/2, py+14);
    ctx.fill();
    ctx.fillStyle = '#8888aa';
    ctx.beginPath();
    ctx.moveTo(px+TILE/2-2, py);
    ctx.lineTo(px+TILE/2+2, py);
    ctx.lineTo(px+TILE/2, py+9);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(px+TILE/2-6, py+TILE-2);
    ctx.lineTo(px+TILE/2+6, py+TILE-2);
    ctx.lineTo(px+TILE/2, py+TILE-18);
    ctx.fill();
    ctx.fillStyle = '#8888aa';
    ctx.beginPath();
    ctx.moveTo(px+TILE/2-2, py+TILE-2);
    ctx.lineTo(px+TILE/2+2, py+TILE-2);
    ctx.lineTo(px+TILE/2, py+TILE-12);
    ctx.fill();
  }
}

function drawRock(px, py) {
  ctx.fillStyle = '#555566';
  ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE-8, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#777788';
  ctx.beginPath(); ctx.arc(px+TILE/2-2, py+TILE-10, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333344';
  ctx.fillRect(px+TILE/2-5, py+TILE-3, 10, 2);
}

function drawColumn(px, py) {
  ctx.fillStyle = '#c9b88a';
  ctx.fillRect(px+TILE/2-5, py+4, 10, TILE-8);
  ctx.fillStyle = '#a8956a';
  ctx.fillRect(px+TILE/2-5, py+4, 2, TILE-8);
  ctx.fillStyle = '#dccfa0';
  ctx.fillRect(px+TILE/2-7, py+2, 14, 4);
  ctx.fillRect(px+TILE/2-7, py+TILE-6, 14, 4);
}

function drawUrn(px, py) {
  ctx.fillStyle = '#8a5a2a';
  ctx.beginPath(); ctx.ellipse(px+TILE/2, py+TILE-10, 7, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(px+TILE/2-4, py+TILE-18, 8, 3);
  ctx.fillStyle = '#aa7a4a';
  ctx.fillRect(px+TILE/2-2, py+TILE-16, 1, 8);
}

function drawVine(px, py) {
  ctx.strokeStyle = '#3a7a3a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px+6, py);
  ctx.bezierCurveTo(px+12, py+10, px+2, py+20, px+10, py+TILE-4);
  ctx.stroke();
  ctx.fillStyle = '#2d5a2d';
  for (let i = 0; i < 4; i++) {
    const ly = py + 4 + i*8;
    ctx.beginPath(); ctx.ellipse(px+6+(i%2?4:-3), ly, 3, 2, 0.5, 0, Math.PI*2); ctx.fill();
  }
}

function drawGlowMushroom(px, py) {
  ctx.fillStyle = '#3a3a5a';
  ctx.fillRect(px+TILE/2-2, py+TILE-10, 4, 8);
  const glow = ctx.createRadialGradient(px+TILE/2, py+TILE-11, 1, px+TILE/2, py+TILE-11, 9);
  glow.addColorStop(0, 'rgba(120,220,255,0.9)');
  glow.addColorStop(1, 'rgba(60,120,200,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(px+TILE/2-10, py+TILE-21, 20, 20);
  ctx.fillStyle = '#6ad6ff';
  ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE-11, 5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(px+TILE/2-1, py+TILE-12, 1, 0, Math.PI*2); ctx.fill();
}

function drawBones(px, py) {
  ctx.fillStyle = '#ddddcc';
  ctx.fillRect(px+8, py+TILE-8, 16, 3);
  ctx.beginPath(); ctx.arc(px+8, py+TILE-7, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+24, py+TILE-7, 2.5, 0, Math.PI*2); ctx.fill();
  // skull
  ctx.beginPath(); ctx.arc(px+14, py+TILE-14, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.fillRect(px+12, py+TILE-15, 1.5, 1.5);
  ctx.fillRect(px+15, py+TILE-15, 1.5, 1.5);
}

function drawCobweb(px, py) {
  ctx.strokeStyle = 'rgba(220,220,240,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, py); ctx.lineTo(px+14, py+14);
  ctx.moveTo(px+14, py); ctx.lineTo(px+2, py+12);
  ctx.moveTo(px, py+8); ctx.lineTo(px+12, py+2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(px+7, py+7, 4, 0, Math.PI*2);
  ctx.arc(px+7, py+7, 7, 0, Math.PI*2);
  ctx.stroke();
}

function drawBanner(px, py, color) {
  ctx.fillStyle = '#aaaaaa';
  ctx.fillRect(px+TILE/2-7, py+2, 14, 2);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(px+TILE/2-6, py+4);
  ctx.lineTo(px+TILE/2+6, py+4);
  ctx.lineTo(px+TILE/2+6, py+TILE-10);
  ctx.lineTo(px+TILE/2, py+TILE-6);
  ctx.lineTo(px+TILE/2-6, py+TILE-10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffcc44';
  ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE/2-2, 2.5, 0, Math.PI*2); ctx.fill();
}

function drawEntities(biome) {
  // Blocks
  level.entities.blocks.forEach(b => {
    const px = b.x * TILE, py = b.y * TILE;
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(px+4, py+4, TILE-8, TILE-8);
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(px+4, py+TILE-10, TILE-8, 6);
    ctx.strokeStyle = '#3a2010';
    ctx.strokeRect(px+4, py+4, TILE-8, TILE-8);
  });
  // Keys
  level.entities.keys.forEach(k => {
    if (k.taken) return;
    const px = k.x*TILE, py = k.y*TILE;
    ctx.fillStyle = '#ffeb70';
    ctx.beginPath();
    ctx.arc(px+TILE/2-6, py+TILE/2, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(px+TILE/2-2, py+TILE/2-2, 12, 4);
    ctx.fillRect(px+TILE/2+6, py+TILE/2+2, 4, 4);
  });
  // Crystals
  level.entities.crystals.forEach(c => {
    if (c.taken) return;
    const px = c.x*TILE+TILE/2, py = c.y*TILE+TILE/2;
    const t = Date.now()/200;
    ctx.save();
    ctx.translate(px, py + Math.sin(t)*2);
    ctx.fillStyle = '#a0e8ff';
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(8, 0);
    ctx.lineTo(0, 14);
    ctx.lineTo(-8, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(3, -2);
    ctx.lineTo(0, 4);
    ctx.lineTo(-3, -2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });
  // Torches
  level.entities.torches.forEach(t => {
    if (t.taken) return;
    const px = t.x*TILE+TILE/2, py = t.y*TILE+TILE/2;
    ctx.fillStyle = '#8a5a2a';
    ctx.fillRect(px-2, py-4, 4, 12);
    ctx.fillStyle = '#ffaa30';
    ctx.beginPath();
    ctx.arc(px, py-8, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffeb70';
    ctx.beginPath();
    ctx.arc(px, py-9, 2, 0, Math.PI*2);
    ctx.fill();
  });
  // Orbs
  level.entities.orbs.forEach(o => {
    if (o.taken) return;
    const px = o.x*TILE+TILE/2, py = o.y*TILE+TILE/2;
    const t = Date.now()/300;
    ctx.fillStyle = `hsl(${(t*60)%360}, 80%, 60%)`;
    ctx.beginPath();
    ctx.arc(px, py + Math.sin(t)*3, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(px-3, py-3 + Math.sin(t)*3, 3, 0, Math.PI*2);
    ctx.fill();
  });
  // Dual plates
  level.entities.dualPlates.forEach(p => {
    const px = p.x*TILE, py = p.y*TILE;
    ctx.fillStyle = p.active ? '#70ff70' : '#aa5050';
    ctx.fillRect(px+6, py+6, TILE-12, TILE-12);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.id === 'A' ? '1' : '2', px+TILE/2, py+TILE/2+6);
  });
  // Symbol plates
  level.entities.symbolPlates.forEach(p => {
    const px = p.x*TILE, py = p.y*TILE;
    ctx.fillStyle = p.active ? '#70a0ff' : '#5a4a8a';
    ctx.fillRect(px+6, py+6, TILE-12, TILE-12);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.id, px+TILE/2, py+TILE/2+6);
  });
  // Enemies
  level.entities.enemies.forEach(e => {
    if (!e.alive) return;
    if (e.type === 'slime') {
      ctx.fillStyle = '#70cc70';
      ctx.beginPath();
      ctx.arc(e.x+TILE/2, e.y+TILE/2+4, 12, 0, Math.PI);
      ctx.fill();
      ctx.fillRect(e.x+TILE/2-12, e.y+TILE/2+4, 24, 8);
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x+TILE/2-5, e.y+TILE/2, 3, 3);
      ctx.fillRect(e.x+TILE/2+3, e.y+TILE/2, 3, 3);
    } else if (e.type === 'bat') {
      ctx.fillStyle = '#5a2a8a';
      ctx.beginPath();
      ctx.arc(e.x+TILE/2, e.y+TILE/2, 8, 0, Math.PI*2);
      ctx.fill();
      const t = Date.now()/100;
      ctx.beginPath();
      ctx.ellipse(e.x+TILE/2-12, e.y+TILE/2, 8, Math.abs(Math.sin(t))*6+2, 0, 0, Math.PI*2);
      ctx.ellipse(e.x+TILE/2+12, e.y+TILE/2, 8, Math.abs(Math.sin(t))*6+2, 0, 0, Math.PI*2);
      ctx.fill();
    }
  });
  // Boss
  if (level.entities.boss && level.entities.boss.hp > 0) {
    const b = level.entities.boss;
    ctx.fillStyle = '#aa30aa';
    ctx.fillRect(b.x-16, b.y-16, 32, 32);
    ctx.fillStyle = '#ff70ff';
    ctx.fillRect(b.x-12, b.y-20, 24, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(b.x-8, b.y-8, 4, 4);
    ctx.fillRect(b.x+4, b.y-8, 4, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(b.x-6, b.y-7, 2, 2);
    ctx.fillRect(b.x+6, b.y-7, 2, 2);
    // HP bar
    ctx.fillStyle = '#400';
    ctx.fillRect(b.x-20, b.y-28, 40, 4);
    ctx.fillStyle = '#f33';
    ctx.fillRect(b.x-20, b.y-28, 40*(b.hp/5), 4);
  }
}

function drawCharacter(ch, isLeo, active) {
  const px = ch.x, py = ch.y;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(px+TILE/2-4, py+TILE-4, 12, 4, 0, 0, Math.PI*2);
  ctx.fill();

  const who = isLeo ? 'leo' : 'mia';
  const img = SPRITES[who][ch.dir];
  // Walking bob
  const bob = ch.moving ? Math.floor(Math.sin(Date.now()/120)*2) : 0;

  if (img && img.complete && img.naturalWidth > 0) {
    // Draw sprite. Scaled to roughly TILE+12 tall, centered horizontally on tile.
    const sh = TILE + 16;
    const sw = sh * (img.naturalWidth / img.naturalHeight);
    const dx = px + TILE/2 - 4 - sw/2;
    const dy = py + TILE - sh - 2 + bob;
    ctx.drawImage(img, dx, dy, sw, sh);
  } else {
    // Fallback placeholder while loading
    ctx.fillStyle = isLeo ? '#3a7a3a' : '#aa3a8a';
    ctx.fillRect(px+6, py+8, 20, 28);
  }

  // Sword swing for Léo
  if (isLeo && ch.attackTimer > 0) {
    ctx.fillStyle = '#e8e8e8';
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    let r;
    if (ch.dir === 'right') r = [px+TILE-4, py+TILE/2-2, 18, 4];
    else if (ch.dir === 'left') r = [px-14, py+TILE/2-2, 18, 4];
    else if (ch.dir === 'up') r = [px+TILE/2-6, py-14, 4, 18];
    else r = [px+TILE/2-6, py+TILE-4, 4, 18];
    ctx.fillRect(...r);
    ctx.strokeRect(...r);
    ch.attackTimer--;
  }

  // Active indicator
  if (active) {
    ctx.strokeStyle = '#ffeb70';
    ctx.lineWidth = 2;
    const t = Date.now()/300;
    ctx.beginPath();
    ctx.arc(px+TILE/2-4, py+TILE-4, 16 + Math.sin(t)*2, Math.PI*0.1, Math.PI*0.9);
    ctx.stroke();
  }
}

function renderGame() {
  const biome = level.data.biome;
  // Tiles
  for (let y = 0; y < level.map.length; y++) {
    for (let x = 0; x < level.map[y].length; x++) {
      drawTile(level.map[y][x], x*TILE, y*TILE, biome, x, y);
    }
  }
  drawDecorations(biome);
  drawEntities(biome);

  // Determine draw order by Y
  const figures = [
    {y: level.leo.y, draw: () => drawCharacter(level.leo, true, false)},
    {y: level.mia.y, draw: () => drawCharacter(level.mia, false, false)},
  ];
  figures.sort((a,b) => a.y - b.y);
  figures.forEach(f => f.draw());

  // Darkness overlay for level 8 — lit around BOTH characters
  if (biome === 'dark') {
    const torchTaken = level.entities.torches.every(t => t.taken);
    const radius = torchTaken ? 160 : 80;
    ctx.save();
    // Draw full dark
    ctx.fillStyle = 'rgba(0,0,0,0.92)';
    ctx.fillRect(0, 0, W, H);
    // Punch light through with destination-out
    ctx.globalCompositeOperation = 'destination-out';
    for (const ch of [level.leo, level.mia]) {
      const cx = ch.x + TILE/2 - 4, cy = ch.y + TILE/2;
      const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, radius);
      grad.addColorStop(0, 'rgba(0,0,0,1)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, 28);
  ctx.fillStyle = '#ffeb70';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(level.data.name, 8, 18);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  let hud = `💎 ${crystals}/10  🗝 ${level.leo.hasKey}  P1 Léo · P2 Mia`;
  if (level.timeLeft !== null) hud += `  ⏱ ${Math.max(0, Math.ceil(level.timeLeft))}s`;
  ctx.fillText(hud, W-8, 18);

  // Message
  if (messageTimer > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(W/2-200, H-60, 400, 40);
    ctx.strokeStyle = '#ffeb70';
    ctx.strokeRect(W/2-200, H-60, 400, 40);
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(message, W/2, H-35);
  }

  // Hint at start
  if (messageTimer === 0 && Date.now() % 6000 < 3000) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W/2-260, H-30, 520, 22);
    ctx.fillStyle = '#c9a8ff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('💡 ' + level.data.hint, W/2, H-15);
  }
}

const MENU_ITEMS = ['Jouer', 'Sélection niveau', 'Règles du jeu', 'Crédits'];

function renderMenu() {
  // Semi-transparent menu panel so the fullscreen background remains visible.
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(42,26,74,0.6)');
  g.addColorStop(1, 'rgba(10,5,32,0.75)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Extra overlay for text readability.
  ctx.fillStyle = 'rgba(5, 4, 16, 0.2)';
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (let i = 0; i < 60; i++) {
    const sx = (i * 137) % W;
    const sy = (i * 211) % (H-100);
    const tw = (Math.sin(Date.now()/500 + i) + 1) / 2;
    ctx.fillStyle = `rgba(255,255,255,${0.3 + tw*0.7})`;
    ctx.fillRect(sx, sy, 2, 2);
  }

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffeb70';
  ctx.font = 'bold 56px monospace';
  ctx.fillText('LÉO & MIA', W/2, 120);
  ctx.fillStyle = '#c9a8ff';
  ctx.font = '24px monospace';
  ctx.fillText('Le Labyrinthe Perdu', W/2, 160);

  // Decorative characters
  ctx.save();
  ctx.translate(220, 280);
  ctx.scale(2.5, 2.5);
  drawCharacter({x:0, y:0, dir:'down', moving:true, attackTimer:0}, true, false);
  ctx.restore();
  ctx.save();
  ctx.translate(500, 280);
  ctx.scale(2.5, 2.5);
  drawCharacter({x:0, y:0, dir:'down', moving:true}, false, false);
  ctx.restore();

  // Menu items
  ctx.font = 'bold 22px monospace';
  MENU_ITEMS.forEach((item, i) => {
    const y = 420 + i * 36;
    if (i === menuIndex) {
      ctx.fillStyle = '#ffeb70';
      ctx.fillText('▶ ' + item + ' ◀', W/2, y);
    } else {
      ctx.fillStyle = '#aaa';
      ctx.fillText(item, W/2, y);
    }
  });

  ctx.fillStyle = '#666';
  ctx.font = '12px monospace';
  ctx.fillText('↑↓ pour naviguer · Entrée pour valider', W/2, H-20);
}

function updateMenu() {
  if (consumePress('ArrowUp') || consumePress('KeyW') || consumePress('KeyZ')) menuIndex = (menuIndex - 1 + MENU_ITEMS.length) % MENU_ITEMS.length;
  if (consumePress('ArrowDown') || consumePress('KeyS')) menuIndex = (menuIndex + 1) % MENU_ITEMS.length;
  if (consumePress('Enter') || consumePress('Space')) {
    if (menuIndex === 0) { currentLevel = 0; state = STATE.INTRO; }
    else if (menuIndex === 1) state = STATE.LEVEL_SELECT;
    else if (menuIndex === 2) { state = STATE.RULES; rulesScroll = 0; }
    else if (menuIndex === 3) state = STATE.CREDITS;
  }
}

// ============ LEVEL SELECT ============
function renderLevelSelect() {
  ctx.fillStyle = '#1a0f2e';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffeb70';
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SÉLECTION DE NIVEAU', W/2, 60);
  ctx.font = '14px monospace';
  ctx.fillStyle = '#c9a8ff';
  ctx.fillText(`Cristaux récupérés : ${crystals} / 10`, W/2, 90);

  for (let i = 0; i < 10; i++) {
    const col = i % 5, row = Math.floor(i / 5);
    const px = 80 + col*140, py = 140 + row*180;
    const unlocked = i <= maxUnlocked;
    const selected = i === menuIndex;
    ctx.fillStyle = unlocked ? (selected ? '#6a4caf' : '#3a2a5f') : '#222';
    ctx.fillRect(px, py, 120, 140);
    ctx.strokeStyle = selected ? '#ffeb70' : '#5a4a8a';
    ctx.lineWidth = selected ? 4 : 2;
    ctx.strokeRect(px, py, 120, 140);
    ctx.fillStyle = unlocked ? '#fff' : '#555';
    ctx.font = 'bold 36px monospace';
    ctx.fillText(String(i+1), px+60, py+60);
    ctx.font = '11px monospace';
    const name = LEVELS[i].name.split('—')[0].replace(/^\d+\.\s*/, '').trim();
    ctx.fillText(name.slice(0, 14), px+60, py+90);
    if (!unlocked) {
      ctx.fillStyle = '#ffeb70';
      ctx.font = '20px monospace';
      ctx.fillText('🔒', px+60, py+120);
    } else if (i < maxUnlocked) {
      ctx.fillStyle = '#a0e8ff';
      ctx.font = '20px monospace';
      ctx.fillText('💎', px+60, py+120);
    }
  }
  ctx.fillStyle = '#c9a8ff';
  ctx.font = '12px monospace';
  ctx.fillText('Flèches pour choisir · Entrée pour jouer · Échap pour revenir', W/2, H-15);
}

function updateLevelSelect() {
  if (consumePress('ArrowLeft') || consumePress('KeyA') || consumePress('KeyQ')) menuIndex = Math.max(0, menuIndex - 1);
  if (consumePress('ArrowRight') || consumePress('KeyD')) menuIndex = Math.min(9, menuIndex + 1);
  if (consumePress('ArrowUp') || consumePress('KeyW') || consumePress('KeyZ')) menuIndex = Math.max(0, menuIndex - 5);
  if (consumePress('ArrowDown') || consumePress('KeyS')) menuIndex = Math.min(9, menuIndex + 5);
  if (consumePress('Enter') || consumePress('Space')) {
    if (menuIndex <= maxUnlocked) {
      currentLevel = menuIndex;
      state = STATE.INTRO;
    }
  }
  if (consumePress('Escape')) { state = STATE.MENU; menuIndex = 0; }
}

  if (consumePress('Escape')) state = STATE.MENU;
}

function renderLevelComplete() {
  renderGame();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffeb70';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('💎 CRISTAL RÉCUPÉRÉ ! 💎', W/2, H/2 - 40);
  ctx.fillStyle = '#fff';
  ctx.font = '18px monospace';
  ctx.fillText(`Cristaux : ${crystals} / 10`, W/2, H/2);
  if (currentLevel < 9) {
    ctx.fillText('Entrée → niveau suivant', W/2, H/2 + 50);
    ctx.fillText('Échap → menu', W/2, H/2 + 80);
    if (consumePress('Enter') || consumePress('Space')) {
      currentLevel++;
      state = STATE.INTRO;
    }
  } else {
    ctx.fillStyle = '#a0e8ff';
    ctx.font = 'bold 22px monospace';
    ctx.fillText('Tu as restauré le Cristal du Savoir !', W/2, H/2 + 50);
    ctx.fillText('Le royaume est sauvé !', W/2, H/2 + 80);
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.fillText('Entrée pour revenir au menu', W/2, H/2 + 120);
    if (consumePress('Enter')) state = STATE.MENU;
  }
  if (consumePress('Escape')) state = STATE.MENU;
}

function renderGameOver() {
  renderGame();
  ctx.fillStyle = 'rgba(80,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ff5050';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('⏱ TEMPS ÉCOULÉ', W/2, H/2 - 20);
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('Entrée pour réessayer · Échap pour le menu', W/2, H/2 + 30);
  if (consumePress('Enter')) { loadLevel(currentLevel); state = STATE.PLAYING; }
  if (consumePress('Escape')) state = STATE.MENU;
}

// ============ MAIN LOOP ============
function loop() {
  document.body.classList.toggle('start-screen-bg', state === STATE.MENU && startScreenReady);

  if (state === STATE.MENU) { renderMenu(); updateMenu(); }
  else if (state === STATE.RULES) { renderRules(); updateRules(); }
  else if (state === STATE.CREDITS) { renderCredits(); }
  else if (state === STATE.LEVEL_SELECT) { renderLevelSelect(); updateLevelSelect(); }
  else if (state === STATE.INTRO) { renderIntro(); }
  else if (state === STATE.PLAYING) {
    updateGame();
    renderGame();
    if (consumePress('Escape')) state = STATE.MENU;
  }
  else if (state === STATE.LEVEL_COMPLETE) { renderLevelComplete(); }
  else if (state === STATE.GAMEOVER) { renderGameOver(); }

  // Reset menuIndex when entering menu
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
